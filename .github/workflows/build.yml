name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install pillow
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
      - name: AVSAITGRAM patches
        run: |
          PYTHONUTF8=1 python3 - <<'EOF'
          import glob, os, re, sys

          applied = []
          skipped = []

          def read(path):
              with open(path, encoding='utf-8') as f:
                  return f.read()

          def write(path, text):
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)

          JAVA = 'TMessagesProj/src/main/java/'

          # 1. API keys (required)
          p = JAVA + 'org/telegram/messenger/BuildVars.java'
          s = read(p)
          s, n1 = re.subn(r'(APP_ID\s*=\s*)\d+(\s*;)', r'\g<1>${{ secrets.APP_ID }}\g<2>', s)
          s, n2 = re.subn(r'(APP_HASH\s*=\s*")[0-9a-fA-F]+(")', r'\g<1>${{ secrets.APP_HASH }}\g<2>', s)
          if n1 != 1 or n2 != 1:
              sys.exit('PATCH FAILED: BuildVars ' + str((n1, n2)))
          write(p, s)
          applied.append('api keys')

          # 2. App name
          p = 'TMessagesProj/src/main/res/values/strings.xml'
          try:
              s = read(p)
              s2 = s.replace('<string name="AppName">Telegram</string>', '<string name="AppName">AVSAITGRAM</string>')
              if s2 == s:
                  raise RuntimeError('AppName string not found')
              write(p, s2)
              applied.append('app name')
          except Exception as e:
              skipped.append('app name: ' + str(e))

          # 3. Own classes
          os.makedirs(JAVA + 'com/avsait', exist_ok=True)
          write(JAVA + 'com/avsait/AvsaitConfig.java', '''package com.avsait;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.telegram.messenger.ApplicationLoader;

          import java.util.concurrent.ConcurrentHashMap;

          public class AvsaitConfig {
              public static final String HIDE_ONLINE = "hide_online";
              public static final String HIDE_TYPING = "hide_typing";
              public static final String HIDE_READ = "hide_read";
              public static final String HIDE_STORIES = "hide_stories";
              public static final String NO_ADS = "no_ads";
              public static final String PREMIUM = "premium";

              private static final ConcurrentHashMap<String, Boolean> values = new ConcurrentHashMap<>();
              private static final ConcurrentHashMap<Class<?>, String> kinds = new ConcurrentHashMap<>();

              private static SharedPreferences prefs(Context context) {
                  if (context == null) {
                      context = ApplicationLoader.applicationContext;
                  }
                  if (context == null) {
                      return null;
                  }
                  return context.getSharedPreferences("avsaitconfig", Context.MODE_PRIVATE);
              }

              public static boolean get(String key) {
                  Boolean v = values.get(key);
                  if (v == null) {
                      SharedPreferences p = prefs(null);
                      if (p == null) {
                          return true;
                      }
                      v = p.getBoolean(key, true);
                      values.put(key, v);
                  }
                  return v;
              }

              public static void set(Context context, String key, boolean value) {
                  values.put(key, value);
                  SharedPreferences p = prefs(context);
                  if (p != null) {
                      p.edit().putBoolean(key, value).apply();
                  }
              }

              public static boolean premium() {
                  return get(PREMIUM);
              }

              private static String classify(String name) {
                  switch (name) {
                      case "TL_account_updateStatus":
                      case "updateStatus":
                          return HIDE_ONLINE;
                      case "TL_messages_setTyping":
                      case "setTyping":
                          return HIDE_TYPING;
                      case "TL_messages_readHistory":
                      case "TL_channels_readHistory":
                      case "readHistory":
                      case "TL_messages_readMessageContents":
                      case "TL_channels_readMessageContents":
                      case "readMessageContents":
                          return HIDE_READ;
                      case "TL_stories_readStories":
                      case "readStories":
                          return HIDE_STORIES;
                      case "TL_messages_getSponsoredMessages":
                      case "TL_channels_getSponsoredMessages":
                      case "getSponsoredMessages":
                          return NO_ADS;
                      default:
                          return "";
                  }
              }

              public static boolean shouldBlock(Object object) {
                  if (object == null) {
                      return false;
                  }
                  Class<?> cls = object.getClass();
                  String key = kinds.get(cls);
                  if (key == null) {
                      key = classify(cls.getSimpleName());
                      kinds.put(cls, key);
                  }
                  return !key.isEmpty() && get(key);
              }
          }
          ''')
          write(JAVA + 'com/avsait/AvsaitSettingsActivity.java', '''package com.avsait;

          import android.app.Activity;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;

          public class AvsaitSettingsActivity extends Activity {
              private static final int BG = 0xFF0E0B16;
              private static final int CARD = 0xFF1B1530;
              private static final int ACCENT = 0xFFA66BFF;
              private static final int TEXT = 0xFFFFFFFF;
              private static final int SUBTEXT = 0xFFA79EBB;

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density);
              }

              private TextView label(String value, int size, int color, boolean bold) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  if (bold) {
                      view.setTypeface(view.getTypeface(), Typeface.BOLD);
                  }
                  return view;
              }

              private LinearLayout card(LinearLayout root, String title) {
                  TextView head = label(title, 12, ACCENT, true);
                  head.setPadding(dp(8), dp(20), 0, dp(8));
                  root.addView(head);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable shape = new GradientDrawable();
                  shape.setColor(CARD);
                  shape.setCornerRadius(dp(16));
                  box.setBackground(shape);
                  box.setPadding(dp(16), dp(8), dp(16), dp(8));
                  root.addView(box, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  return box;
              }

              private void row(LinearLayout box, String title, String hint, String key) {
                  LinearLayout item = new LinearLayout(this);
                  item.setOrientation(LinearLayout.VERTICAL);
                  item.setPadding(0, dp(10), 0, dp(10));
                  Switch toggle = new Switch(this);
                  toggle.setText(title);
                  toggle.setTextSize(16);
                  toggle.setTextColor(TEXT);
                  toggle.setChecked(AvsaitConfig.get(key));
                  toggle.setOnCheckedChangeListener((button, checked) -> AvsaitConfig.set(AvsaitSettingsActivity.this, key, checked));
                  item.addView(toggle);
                  TextView note = label(hint, 12, SUBTEXT, false);
                  note.setPadding(0, dp(4), dp(56), 0);
                  item.addView(note);
                  box.addView(item);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setTitle("AVSAITGRAM");
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(BG);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(32), dp(16), dp(32));
                  scroll.addView(root);

                  root.addView(label("AVSAITGRAM", 28, TEXT, true));
                  TextView subtitle = label("Настройки клиента", 14, SUBTEXT, false);
                  subtitle.setPadding(0, dp(2), 0, 0);
                  root.addView(subtitle);

                  LinearLayout ghost = card(root, "РЕЖИМ ПРИЗРАКА");
                  row(ghost, "Скрыть «в сети»", "Другие не видят, что вы онлайн.", AvsaitConfig.HIDE_ONLINE);
                  row(ghost, "Скрыть «печатает»", "Собеседник не видит, что вы набираете сообщение.", AvsaitConfig.HIDE_TYPING);
                  row(ghost, "Не отмечать прочитанным", "Собеседник не видит, что вы прочитали сообщение.", AvsaitConfig.HIDE_READ);
                  row(ghost, "Не отмечать просмотр историй", "Автор не видит, что вы смотрели историю.", AvsaitConfig.HIDE_STORIES);

                  LinearLayout ads = card(root, "РЕКЛАМА");
                  row(ads, "Скрыть рекламные сообщения", "Пытается убрать спонсорские сообщения в каналах.", AvsaitConfig.NO_ADS);

                  LinearLayout premium = card(root, "PREMIUM");
                  row(premium, "Локальный Premium", "Меняет только интерфейс этого приложения. Серверные функции Premium не открывает. После переключения закройте и откройте приложение.", AvsaitConfig.PREMIUM);

                  LinearLayout about = card(root, "О ПРОГРАММЕ");
                  TextView info = label("AVSAITGRAM. Неофициальный клиент на открытом коде Telegram для Android. Подарки и Stars работают за реальный баланс аккаунта.", 13, SUBTEXT, false);
                  info.setPadding(0, dp(10), 0, dp(10));
                  about.addView(info);

                  Button restart = new Button(this);
                  restart.setText("Закрыть приложение");
                  restart.setOnClickListener(view -> {
                      finishAffinity();
                      android.os.Process.killProcess(android.os.Process.myPid());
                  });
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  params.topMargin = dp(24);
                  root.addView(restart, params);

                  setContentView(scroll);
              }
          }
          ''')
          applied.append('own classes')

          # 4. Manifest entry for settings
          p = 'TMessagesProj/src/main/AndroidManifest.xml'
          try:
              s = read(p)
              if s.count('</application>') != 1:
                  raise RuntimeError('</application> not unique')
              entry = '''    <activity
                  android:name="com.avsait.AvsaitSettingsActivity"
                  android:label="AVSAIT настройки"
                  android:exported="true"
                  android:icon="@mipmap/ic_launcher"
                  android:taskAffinity="com.avsait.settings"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          </application>'''
              write(p, s.replace('</application>', entry))
              applied.append('settings entry in manifest')
          except Exception as e:
              skipped.append('settings entry: ' + str(e))

          # 5. Ghost mode and ads hook in ConnectionsManager
          p = JAVA + 'org/telegram/tgnet/ConnectionsManager.java'
          try:
              s = read(p)
              pattern = re.compile(r'(public\s+int\s+sendRequest\(\s*TLObject\s+object\s*,[^{;]*?\)\s*\{)')
              s, n = pattern.subn(lambda m: m.group(1) + '\n        if (com.avsait.AvsaitConfig.shouldBlock(object)) {\n            return 0;\n        }', s)
              if n == 0:
                  raise RuntimeError('sendRequest not found')
              write(p, s)
              applied.append('request hook (%d)' % n)
          except Exception as e:
              skipped.append('request hook: ' + str(e))

          # 6. Local premium
          p = JAVA + 'org/telegram/messenger/UserConfig.java'
          try:
              s = read(p)
              pattern = re.compile(r'(public\s+boolean\s+isPremium\(\)\s*\{)')
              s, n = pattern.subn(lambda m: m.group(1) + '\n        if (com.avsait.AvsaitConfig.premium() && isClientActivated()) {\n            return true;\n        }', s, count=1)
              if n == 0:
                  raise RuntimeError('isPremium not found')
              write(p, s)
              applied.append('local premium')
          except Exception as e:
              skipped.append('local premium: ' + str(e))

          # 7. Icon
          try:
              from PIL import Image
              files = [f for e in ('png', 'jpg', 'jpeg') for f in glob.glob('*.' + e)]
              if not files:
                  raise RuntimeError('no logo image in repo root')
              logo = Image.open(files[0]).convert('RGB')
              base = 'TMessagesProj/src/main/res/'
              os.makedirs(base + 'drawable-nodpi', exist_ok=True)
              os.makedirs(base + 'drawable', exist_ok=True)
              logo.resize((432, 432), Image.LANCZOS).save(base + 'drawable-nodpi/avsait_icon.png')
              write(base + 'drawable/avsait_foreground.xml', '<?xml version="1.0" encoding="utf-8"?>\n<inset xmlns:android="http://schemas.android.com/apk/res/android" android:drawable="@drawable/avsait_icon" android:inset="17%"/>\n')
              adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@android:color/black"/>\n    <foreground android:drawable="@drawable/avsait_foreground"/>\n</adaptive-icon>\n'
              png_count = 0
              xml_count = 0
              for root in glob.glob('TMessagesProj*/src/main/res'):
                  for path in glob.glob(root + '/mipmap-*/ic_launcher*.png') + glob.glob(root + '/drawable*/ic_launcher*.png'):
                      name = os.path.basename(path).lower()
                      if any(x in name for x in ('foreground', 'background', 'monochrome')):
                          continue
                      w, h = Image.open(path).size
                      logo.resize((w, h), Image.LANCZOS).save(path)
                      png_count += 1
                  for path in glob.glob(root + '/mipmap-anydpi*/ic_launcher*.xml') + glob.glob(root + '/drawable*/ic_launcher*.xml'):
                      if '<adaptive-icon' in read(path):
                          write(path, adaptive)
                          xml_count += 1
              if png_count + xml_count == 0:
                  raise RuntimeError('no launcher icon files found')
              applied.append('icon (%d png, %d adaptive)' % (png_count, xml_count))
          except Exception as e:
              skipped.append('icon: ' + str(e))

          print('=== APPLIED ===')
          for x in applied:
              print('  OK  ', x)
          print('=== SKIPPED ===')
          for x in skipped:
              print('  SKIP', x)
          EOF
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AVSAITGRAM2-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
